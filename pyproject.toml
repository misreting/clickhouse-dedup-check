[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickhouse-dedup-check"
version = "0.1.0"
description = "Audit ClickHouse ReplacingMergeTree tables for the eventual-deduplication trap"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{name = "clickhouse-dedup-check"}]
keywords = ["clickhouse", "replacingmergetree", "deduplication", "data-quality", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/agentscope-ai-java/clickhouse-dedup-check"

[project.scripts]
clickhouse-dedup-check = "clickhouse_dedup_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/clickhouse_dedup_check"]

[tool.mypy]
strict = true
